[package]
name = "cargo-buildscan"
version = "0.1.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = ["sl91994 <112153975+sl91994@users.noreply.github.com>"]
edition = "2024"

# build.rs を持つ依存関係が組み込まれているが，cargo-buildscan 自身で検証し，CIで毎回自己スキャンしてリリースする
[dependencies]
cargo_metadata = "0.23.1"
lexopt = "0.3.2"
proc-macro2 = { version = "1.0.107", default-features = false, features = [
    "span-locations",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
syn = { version = "3.0.9", default-features = false, features = [
    "full",
    "visit",
    "parsing",
] }
toml = "1.1.8"

[dev-dependencies]
insta = "1.49.0"
